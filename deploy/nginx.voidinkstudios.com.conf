# VOIDINK marketing site — serves the built SPA from this checkout's dist/
#   voidinkstudios.com / www → /var/www/frontend/dist
#
# Install:
#   sudo cp /var/www/frontend/deploy/nginx.voidinkstudios.com.conf \
#           /etc/nginx/sites-available/voidinkstudios.com
#   sudo ln -sf /etc/nginx/sites-available/voidinkstudios.com /etc/nginx/sites-enabled/
#   sudo mv /etc/nginx/sites-enabled/default /etc/nginx/sites-available/default.bak
#   sudo nginx -t && sudo systemctl reload nginx
#
# Cert: existing certbot cert for voidinkstudios.com + www.
# Swap both ssl_certificate paths to /etc/letsencrypt/live/voidinkstudios-wildcard/
# once the wildcard cert is issued.

server {
    listen 80;
    listen [::]:80;
    server_name voidinkstudios.com www.voidinkstudios.com;
    return 301 https://voidinkstudios.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.voidinkstudios.com;

    ssl_certificate     /etc/letsencrypt/live/voidinkstudios.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/voidinkstudios.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://voidinkstudios.com$request_uri;
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name voidinkstudios.com;

    ssl_certificate     /etc/letsencrypt/live/voidinkstudios.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/voidinkstudios.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/frontend/dist;
    index index.html;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Old .html paths kept working (mirrors dist/_redirects)
    location = /privacy-policy.html { return 301 /privacy-policy; }
    location = /terms-of-service.html { return 301 /terms-of-service; }
    location = /faq.html { return 301 /faq; }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml image/webp;
}
