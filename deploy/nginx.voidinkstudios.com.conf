server {
    listen 80;
    server_name www.voidinkstudios.com;
    return 301 https://voidinkstudios.com$request_uri;
}

server {
    listen 443 ssl;
    server_name www.voidinkstudios.com;

    ssl_certificate /etc/letsencrypt/live/voidinkstudios.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/voidinkstudios.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://voidinkstudios.com$request_uri;
}

# VOIDINK Studios production frontend
server {
    listen 80;
    server_name voidinkstudios.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name voidinkstudios.com;

    ssl_certificate /etc/letsencrypt/live/voidinkstudios.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/voidinkstudios.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/frontend/dist;
    index index.html;

    # Site-wide security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Start in report-only mode so policy violations can be checked before
    # enforcing CSP and accidentally breaking the React app or order form.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; img-src 'self' data: https:; font-src 'self' https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self' 'unsafe-inline' https://www.google.com https://www.gstatic.com; frame-src https://www.google.com; connect-src 'self' https://api.voidinkstudios.com https://script.google.com https://script.googleusercontent.com https://www.google.com" always;

    # Keep legacy static URLs working.
    location = /privacy-policy.html { return 301 /privacy-policy; }
    location = /terms-of-service.html { return 301 /terms-of-service; }
    location = /faq.html { return 301 /faq; }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    # Staff portal. X-Robots-Tag is authoritative for this SPA because every
    # route serves the same index.html before React updates the page metadata.
    location ^~ /admin {
        # Create this credentials file on the VPS before reloading nginx:
        # sudo apt install -y apache2-utils
        # sudo htpasswd -c /etc/nginx/voidink-admin.htpasswd <staff-user>
        auth_basic "VOIDINK staff";
        auth_basic_user_file /etc/nginx/voidink-admin.htpasswd;

        # Location-level add_header overrides inheritance, so repeat headers.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: https:; font-src 'self' https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self' 'unsafe-inline' https://www.google.com https://www.gstatic.com; frame-src https://www.google.com; connect-src 'self' https://api.voidinkstudios.com https://www.google.com" always;

        try_files $uri $uri/ /index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # error_log /var/log/nginx/voidinkstudios_error.log;
    # access_log /var/log/nginx/voidinkstudios_access.log;
}